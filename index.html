<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Banka">
<meta name="theme-color" content="#24493a">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Banka demo</title>
<style>
:root{
  --green:#24493a; --green-d:#1c3a2e; --green-t:#1f4d3a; --pos:#2b6a45;
  --mint:#e1f3ea; --mint-i:#dff3e8; --orange:#d2612b; --ink:#262626; --gray:#555; --line:#e6e6e6;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);
  font-family:"Poppins","Avenir Next","Helvetica Neue",system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{touch-action:manipulation;font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:relative;width:100%;height:100dvh;overflow:hidden;background:#fff;margin:0 auto;max-width:480px}
@media(min-width:600px){
  body{background:#0e1512;display:flex;align-items:center;justify-content:center}
  #app{height:min(100dvh - 24px,900px);width:430px;border-radius:44px;box-shadow:0 20px 80px #000a}
}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:#fff;-webkit-overflow-scrolling:touch}
.screen.enter{animation:in .22s ease-out}
@keyframes in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.screen.enter-up{animation:inup .22s ease-out}
@keyframes inup{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
svg{display:block;flex:none}
.sat{height:var(--sat);background:var(--green);position:sticky;top:0;z-index:5}

/* ---------- HOME ---------- */
.hero{position:relative;background:var(--green);color:#fff;padding:calc(var(--sat) + 18px) 20px 36px;overflow:hidden}
.hero:before{content:"";position:absolute;right:-30%;top:-10%;width:90%;height:75%;background:#ffffff0a;border-radius:50%}
.hero:after{content:"";position:absolute;right:-25%;bottom:-18%;width:70%;height:50%;background:#ffffff08;border-radius:50%}
.hero>*{position:relative;z-index:1}
.row{display:flex;align-items:center}
.sp{justify-content:space-between}
.ibtn{width:44px;height:44px;display:grid;place-items:center;position:relative}
.badge{position:absolute;top:4px;right:2px;width:15px;height:15px;border-radius:50%;background:#6fe3a8;color:#0d3a28;font-size:10px;display:grid;place-items:center;font-weight:600}
.pill{background:var(--green-d);border-radius:30px;padding:0 18px;height:46px;gap:12px;font-size:16px;font-weight:500;display:flex;align-items:center}
.circ{width:46px;height:46px;border-radius:50%;background:var(--green-d);display:grid;place-items:center}
.bal{font-size:44px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.bal small{font-size:26px;font-weight:600}
.bal-l{font-size:15px;opacity:.9;margin-top:6px}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0}
.box{border:1.5px solid #ffffff55;border-radius:26px;padding:16px;font-size:14.5px}
.box b{display:block;margin-top:2px;font-size:15px}
.mi{width:34px;height:34px;border-radius:9px;background:var(--mint-i);color:var(--green);display:grid;place-items:center;margin-bottom:12px}
.iban{font-size:17px;font-weight:500;letter-spacing:.2px}
.sheet{position:relative;margin-top:-18px;background:#fff;border-radius:34px 34px 0 0;padding:22px 20px calc(120px + var(--sab))}
.promo{border-radius:26px;background:linear-gradient(100deg,#f8eee8,#e3f3ea);padding:18px 16px 18px 18px;display:flex;gap:6px}
.promo h3{margin:0 0 10px;font-size:16.5px;line-height:1.3;font-weight:700}
.promo p{margin:0 0 12px;font-size:15.5px;line-height:1.3}
.btn{background:var(--green-d);color:#fff;border-radius:30px;padding:0 22px;height:42px;font-size:14px;font-weight:600;text-transform:uppercase;display:inline-flex;align-items:center}
.sect{display:flex;align-items:center;justify-content:space-between;margin:34px 0 22px}
.sect h2{margin:0 0 0 14px;font-size:26px;font-weight:700;flex:1}
.link{color:var(--green-t);text-decoration:underline;font-size:16.5px;font-weight:500}
.tx-home{display:flex;justify-content:space-between;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.tx-home .t{font-size:17px;line-height:1.5}
.tx-home .d{color:var(--gray);font-size:15px;margin-top:6px}
.pos{color:var(--pos);font-weight:700}
.neg{font-weight:700;color:#1c1c1c}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(96px + var(--sab));background:#fff;border:1.5px solid var(--line);border-bottom:0;border-radius:34px 34px 0 0;display:grid;grid-template-columns:repeat(3,1fr);padding-top:14px;z-index:6;box-shadow:0 -4px 20px #0000000a}
.tab{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15px;color:#333}

/* ---------- MENU ---------- */
.menu{padding:calc(var(--sat) + 18px) 20px 60px;background:#fff}
.menu .top{display:flex;align-items:center;gap:22px;margin-bottom:34px}
.menu .top .x{margin-left:auto}
.mitem{background:#fff;border-radius:22px;box-shadow:0 4px 18px #00000012;margin-bottom:20px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:18px;height:72px;padding:0 20px;font-size:20px;width:100%;text-align:left}
.mhead span{flex:1}
.mhead.offer{background:linear-gradient(90deg,#d9f1e7,#f9eee9);color:var(--green-t);border-radius:22px;margin-bottom:34px}
.sub{display:none;padding:0 24px 26px 66px}
.mitem.open .sub{display:block}
.sub a{display:block;font-size:17px;text-decoration:underline;padding:10px 0;margin-bottom:6px;cursor:pointer}
.out{display:inline-flex;align-items:center;gap:12px;font-size:18px;font-weight:600;color:var(--green-t);margin-top:8px}
.out u{text-underline-offset:3px}

/* ---------- KARTY ---------- */
.chead{position:relative;background:var(--green);color:#fff;padding:calc(var(--sat) + 18px) 20px 0;border-radius:0 0 0 90px;height:calc(var(--sat) + 330px)}
.chead h1{margin:34px 0 16px;font-size:30px;font-weight:700}
.chip{display:inline-block;background:#e8f3ec;color:#222;border-radius:7px;padding:8px 12px;font-size:15px;text-transform:uppercase}
.cname{font-size:25px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:10px}
.car{margin-top:-4px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:5%;padding:0 15%;scrollbar-width:none;position:relative;z-index:2}
.car::-webkit-scrollbar{display:none}
.card{flex:0 0 70%;aspect-ratio:1.586;border-radius:22px;scroll-snap-align:center;position:relative;color:#4a3d12;box-shadow:0 8px 20px #0003;overflow:hidden}
.card .bn{position:absolute;left:14px;top:16px;font-family:Georgia,serif;font-size:20px;letter-spacing:.5px}
.card .bn small{display:block;font-size:11px;margin-top:-2px;font-style:italic;font-family:inherit}
.card .ty{position:absolute;right:30px;bottom:72px;font-size:20px;font-weight:600}
.card .mc{position:absolute;right:16px;bottom:16px;display:flex}
.card .mc i{width:46px;height:46px;border-radius:50%;display:block}
.card .mc i:first-child{background:#e12a2a}
.card .mc i:last-child{background:#f3a128;margin-left:-16px;mix-blend-mode:multiply}
.card .ico{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--green)}
.g-gold{background:radial-gradient(circle at 40% 55%,#f3dd8f,#e9c45e 55%,#d9b246)}
.g-green{background:linear-gradient(135deg,#2f6a52,#173a2d);color:#e9f6ef}
.g-silver{background:linear-gradient(135deg,#e8eaec,#b9bfc4);color:#333}
.g-night{background:linear-gradient(135deg,#3b4d8a,#1d2748);color:#e8edff}
.dots{display:flex;justify-content:center;gap:7px;margin:14px 0 26px}
.dots i{width:8px;height:8px;border-radius:5px;background:#555;opacity:.8;transition:.2s}
.dots i.on{width:26px;background:var(--green-d);opacity:1}
.acts{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:0 20px;font-size:16px}
.acts .mi{width:60px;height:60px;border-radius:50%;margin:0 auto 12px;background:var(--mint-i)}
.pay{margin:36px 12px 0;background:var(--mint);border-radius:22px;padding:18px 20px}
.pay em{display:block;font-size:15.5px;color:#444;line-height:1.35}
.pay .r{display:flex;justify-content:space-between;align-items:center;padding:20px 0 16px;border-bottom:1px solid #c9e2d4}
.pay .r2{padding-top:14px}
.pay .big{font-size:22px;font-weight:700;color:#333;margin-top:4px}
.pay .lbl{font-size:19px;color:#444}
.btn2{background:var(--green-d);color:#fff;border-radius:30px;height:50px;padding:0 20px;font-size:16px;font-weight:600;display:inline-flex;align-items:center}
.lim{margin:48px 12px calc(40px + var(--sab));background:#fff;border-radius:22px;box-shadow:0 2px 18px #0000001a;padding:24px 22px}
.lim .lbl{font-size:17.5px;color:#444}
.lim .big{font-size:26px;font-weight:700;margin:6px 0 16px}
.bar{height:34px;border:2px solid #777;border-radius:20px;background:#f3f3f3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);border-radius:20px 0 0 20px}
.lg{display:flex;justify-content:space-between;margin-top:14px;font-size:16px;color:#444}
.lg .dot:before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--orange);margin-right:10px;vertical-align:-1px}

/* ---------- TRANSAKCIE ---------- */
.thead{position:sticky;top:0;z-index:4;background:#fff;padding:18px 16px 12px}
.thead .ttl{display:flex;align-items:center;height:48px;margin-bottom:22px}
.thead .ttl h1{flex:1;text-align:center;margin:0 44px 0 0;font-size:23px;font-weight:500}
.srch{display:flex;align-items:center;gap:12px}
.srch label{flex:1;display:flex;align-items:center;gap:12px;border:1.5px solid #333;border-radius:30px;height:58px;padding:0 20px}
.srch input{border:0;outline:0;font:inherit;font-size:17px;width:100%;background:none;color:var(--ink)}
.srch input::placeholder{color:#222;font-weight:500}
.trow{display:flex;justify-content:space-between;gap:12px;padding:26px 22px 24px 28px;border-bottom:1px solid var(--line)}
.trow .l{flex:1;min-width:0}
.pend{display:inline-flex;align-items:center;gap:8px;background:#f0f0f0;border-radius:9px;padding:9px 14px;font-size:16px;margin-bottom:12px}
.trow .k{font-size:19px;color:#4a4a4a}
.trow .dsc{font-size:19px;color:#4a4a4a;line-height:1.28;margin-top:4px;word-break:break-word}
.trow .rt{text-align:right;white-space:nowrap}
.trow .dt{font-size:17px;color:#555}
.trow .am{font-size:21px;font-weight:700;margin-top:10px;color:#1c1c1c}
.trow.has .rt{padding-top:3px}
.more{display:block;width:100%;text-align:left;padding:26px 16px calc(60px + var(--sab));font-size:19px;font-weight:500;color:var(--green-t);text-transform:uppercase}
.empty{padding:60px 30px;text-align:center;color:#777;font-size:17px}

/* ---------- OSTATNE ---------- */
.stub{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 36px;color:#555;font-size:17px;line-height:1.5;min-height:70%}
.toast{position:absolute;left:50%;bottom:calc(30px + var(--sab));transform:translate(-50%,20px);background:#222;color:#fff;padding:13px 20px;border-radius:30px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ov{position:absolute;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mod{background:#fff;width:100%;border-radius:30px 30px 0 0;padding:26px 24px calc(30px + var(--sab));animation:inb .25s ease-out}
@keyframes inb{from{transform:translateY(40px)}to{transform:none}}
.mod h3{margin:0 0 18px;font-size:22px}
.mod .opt{display:block;width:100%;text-align:left;padding:16px 0;font-size:18px;border-bottom:1px solid var(--line)}
.pin{display:flex;gap:14px;justify-content:center;margin:26px 0 20px}
.pin b{width:56px;height:68px;border-radius:14px;background:var(--mint);display:grid;place-items:center;font-size:30px;color:var(--green)}
.mod .btn2{width:100%;justify-content:center;margin-top:16px}
</style>
</head>

  let t;car.addEventListener("scroll",()=>{clearTimeout(t);t=setTimeout(()=>{
    const c=car.getBoundingClientRect();let best=0,bd=1e9;
    [...car.children].forEach((k,j)=>{const r=k.getBoundingClientRect();const d=Math.abs(r.left+r.width/2-(c.left+c.width/2));if(d<bd){bd=d;best=j}});

}

function initTx(el,p){

}
