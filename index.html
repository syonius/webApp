<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="VÚB Banking">
<meta name="theme-color" content="#24493a">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Banka demo</title>
<style>
:root{
  --green:#24493a; --green-d:#1c3a2e; --green-t:#1f4d3a; --pos:#2b6a45;
  --mint:#e1f3ea; --mint-i:#dff3e8; --orange:#d2612b; --ink:#262626; --gray:#555; --line:#e6e6e6;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--green)}
html,body{margin:0;height:100%;color:var(--ink);
  font-family:"Poppins","Avenir Next","Helvetica Neue",system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{touch-action:manipulation;font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:#fff;container-type:inline-size}
@media(min-width:600px){
  body{background:#0e1512;display:flex;align-items:center;justify-content:center}
  #app{position:relative;inset:auto;height:min(100dvh - 24px,900px);width:430px;border-radius:44px;box-shadow:0 20px 80px #000a}
}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:#fff;-webkit-overflow-scrolling:touch}
.screen.enter{animation:in .22s ease-out}
@keyframes in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.screen.enter-up{animation:inup .22s ease-out}
@keyframes inup{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
svg{display:block;flex:none}
.sat{height:var(--sat);background:var(--green);position:sticky;top:0;z-index:5}

/* ---------- HOME ---------- */
.hero{position:relative;color:#fff;padding:8px 20px 36px}
.screen.home{overflow:hidden;display:flex;flex-direction:column;background:var(--green)}
.home .deco{position:absolute;right:-30%;top:-10%;width:90%;height:430px;background:#ffffff0a;border-radius:50%;pointer-events:none}
.home .deco2{position:absolute;right:-25%;top:340px;width:70%;height:330px;background:#ffffff08;border-radius:50%;pointer-events:none}
.topbar{position:relative;z-index:2;flex:none;color:#fff;padding:calc(var(--sat) + 18px) 20px 2px}
.home .scroll{position:relative;z-index:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.row{display:flex;align-items:center}
.sp{justify-content:space-between}
.ibtn{width:44px;height:44px;display:grid;place-items:center;position:relative}
.badge{position:absolute;top:4px;right:2px;width:15px;height:15px;border-radius:50%;background:#6fe3a8;color:#0d3a28;font-size:10px;display:grid;place-items:center;font-weight:600}
.pill{background:var(--green-d);border-radius:30px;padding:0 18px;height:46px;gap:12px;font-size:16px;font-weight:500;display:flex;align-items:center}
.circ{width:46px;height:46px;border-radius:50%;background:var(--green-d);display:grid;place-items:center}
.bal{font-size:44px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.bal small{font-size:26px;font-weight:600}
.bal-l{font-size:15px;opacity:.9;margin-top:6px}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0}
.box{border:1.5px solid #ffffff55;border-radius:26px;padding:16px;font-size:14.5px}
.box b{display:block;margin-top:2px;font-size:15px}
.mi{width:34px;height:34px;border-radius:9px;background:var(--mint-i);color:var(--green);display:grid;place-items:center;margin-bottom:12px}
.iban{font-size:17px;font-weight:500;letter-spacing:.2px}
.sheet{position:relative;margin-top:-18px;background:#fff;border-radius:34px 34px 0 0;padding:22px 20px calc(120px + var(--sab))}
.promo{border-radius:26px;background:linear-gradient(100deg,#f8eee8,#e3f3ea);padding:18px 16px 18px 18px;display:flex;gap:6px}
.promo h3{margin:0 0 10px;font-size:16.5px;line-height:1.3;font-weight:700}
.promo p{margin:0 0 12px;font-size:15.5px;line-height:1.3}
.btn{background:var(--green-d);color:#fff;border-radius:30px;padding:0 22px;height:42px;font-size:14px;font-weight:600;text-transform:uppercase;display:inline-flex;align-items:center}
.sect{display:flex;align-items:center;justify-content:space-between;margin:34px 0 22px}
.sect h2{margin:0 0 0 14px;font-size:26px;font-weight:700;flex:1}
.link{color:var(--green-t);text-decoration:underline;font-size:16.5px;font-weight:500}
.tx-home{display:flex;justify-content:space-between;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.tx-home .t{font-size:17px;line-height:1.5}
.tx-home .d{color:var(--gray);font-size:15px;margin-top:6px}
.pos{color:var(--pos);font-weight:700}
.neg{font-weight:700;color:#1c1c1c}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(109px - var(--gap,0px));background:#fff;border:1.5px solid var(--line);border-bottom:0;border-radius:30px 30px 0 0;display:grid;grid-template-columns:repeat(3,1fr);padding-top:8px;z-index:6;box-shadow:0 -4px 20px #0000000a}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;line-height:1.2;color:#333;align-self:start}

/* ---------- MENU ---------- */
.menu{padding:calc(var(--sat) + 18px) 20px 60px;background:#fff}
.menu .top{display:flex;align-items:center;gap:22px;margin-bottom:34px}
.menu .top .x{margin-left:auto}
.mitem{background:#fff;border-radius:22px;box-shadow:0 4px 18px #00000012;margin-bottom:20px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:18px;height:72px;padding:0 20px;font-size:20px;width:100%;text-align:left}
.mhead span{flex:1}
.mhead.offer{background:linear-gradient(90deg,#d9f1e7,#f9eee9);color:var(--green-t);border-radius:22px;margin-bottom:34px}
.sub{display:none;padding:0 24px 26px 66px}
.mitem.open .sub{display:block}
.sub a{display:block;font-size:17px;text-decoration:underline;padding:10px 0;margin-bottom:6px;cursor:pointer}
.out{display:inline-flex;align-items:center;gap:12px;font-size:18px;font-weight:600;color:var(--green-t);margin-top:8px}
.out u{text-underline-offset:3px}

/* ---------- KARTY ---------- */
.chead{position:relative;background:var(--green);color:#fff;padding:calc(var(--sat) + 18px) 20px 0;border-radius:0 0 0 90px;height:calc(var(--sat) + 330px)}
.chead h1{margin:34px 0 16px;font-size:30px;font-weight:700}
.chip{display:inline-block;background:#e8f3ec;color:#222;border-radius:7px;padding:8px 12px;font-size:15px;text-transform:uppercase}
.cname{font-size:25px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:10px}
.car{margin-top:-4px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10.8cqw;padding:0 15cqw;scrollbar-width:none;position:relative;z-index:2}
.car::-webkit-scrollbar{display:none}
.card{flex:0 0 70cqw;aspect-ratio:1.744;border-radius:6cqw;scroll-snap-align:center;position:relative;box-shadow:0 .8cqw 3cqw #0003;overflow:hidden;background:#ddd center/cover no-repeat}
.dots{display:flex;justify-content:center;gap:7px;margin:14px 0 26px}
.dots i{width:8px;height:8px;border-radius:5px;background:#555;opacity:.8;transition:.2s}
.dots i.on{width:26px;background:var(--green-d);opacity:1}
.acts{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:0 20px;font-size:16px}
.acts .mi{width:60px;height:60px;border-radius:50%;margin:0 auto 12px;background:var(--mint-i)}
.pay{margin:36px 12px 0;background:var(--mint);border-radius:22px;padding:18px 20px}
.pay em{display:block;font-size:15.5px;color:#444;line-height:1.35}
.pay .r{display:flex;justify-content:space-between;align-items:center;padding:20px 0 16px;border-bottom:1px solid #c9e2d4}
.pay .r2{padding-top:14px}
.pay .big{font-size:22px;font-weight:700;color:#333;margin-top:4px}
.pay .lbl{font-size:19px;color:#444}
.btn2{background:var(--green-d);color:#fff;border-radius:30px;height:50px;padding:0 20px;font-size:16px;font-weight:600;display:inline-flex;align-items:center}
.lim{margin:48px 12px calc(40px + var(--sab));background:#fff;border-radius:22px;box-shadow:0 2px 18px #0000001a;padding:24px 22px}
.lim .lbl{font-size:17.5px;color:#444}
.lim .big{font-size:26px;font-weight:700;margin:6px 0 16px}
.bar{height:34px;border:2px solid #777;border-radius:20px;background:#f3f3f3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);border-radius:20px 0 0 20px}
.lg{display:flex;justify-content:space-between;margin-top:14px;font-size:16px;color:#444}
.lg .dot:before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--orange);margin-right:10px;vertical-align:-1px}

/* ---------- TRANSAKCIE ---------- */
.thead{position:sticky;top:0;z-index:4;background:#fff;padding:18px 16px 12px}
.thead .ttl{display:flex;align-items:center;height:48px;margin-bottom:22px}
.thead .ttl h1{flex:1;text-align:center;margin:0 44px 0 0;font-size:23px;font-weight:500}
.srch{display:flex;align-items:center;gap:12px}
.srch label{flex:1;display:flex;align-items:center;gap:12px;border:1.5px solid #333;border-radius:30px;height:58px;padding:0 20px}
.srch input{border:0;outline:0;font:inherit;font-size:17px;width:100%;background:none;color:var(--ink)}
.srch input::placeholder{color:#222;font-weight:500}
.trow{display:flex;justify-content:space-between;gap:12px;padding:26px 22px 24px 28px;border-bottom:1px solid var(--line)}
.trow .l{flex:1;min-width:0}
.pend{display:inline-flex;align-items:center;gap:8px;background:#f0f0f0;border-radius:9px;padding:9px 14px;font-size:16px;margin-bottom:12px}
.trow .k{font-size:19px;color:#4a4a4a}
.trow .dsc{font-size:19px;color:#4a4a4a;line-height:1.28;margin-top:4px;word-break:break-word}
.trow .rt{text-align:right;white-space:nowrap}
.trow .dt{font-size:17px;color:#555}
.trow .am{font-size:21px;font-weight:700;margin-top:10px;color:#1c1c1c}
.trow.has .rt{padding-top:3px}
.more{display:block;width:100%;text-align:left;padding:26px 16px calc(60px + var(--sab));font-size:19px;font-weight:500;color:var(--green-t);text-transform:uppercase}
.empty{padding:60px 30px;text-align:center;color:#777;font-size:17px}

/* ---------- FILTER + DETAIL ---------- */
.ov.fov{align-items:flex-end;background:#0007}
.fsheet{position:relative;background:#fff;width:100%;height:calc(100% - var(--sat) - 40px);border-radius:34px 34px 0 0;padding:20px 0 0;display:flex;flex-direction:column;animation:inb .25s ease-out}
.fsheet h3{margin:20px 22px 22px;font-size:19px;font-weight:700;color:#333}
.fx{position:absolute;right:20px;top:20px;color:#333}
.frow{border-bottom:1.5px solid var(--line)}
.fhead{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:20px 22px;color:#333}
.fhead span{flex:1}.fhead b{display:block;font-size:19px;font-weight:700}.fhead em{display:block;font-style:normal;font-size:16px;color:#666;margin-top:6px;min-height:20px}
.fhead .chev{transition:.2s}.frow.open .chev{transform:rotate(180deg)}
.fscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.fbody{display:none;padding:0 22px 22px 70px;gap:12px;grid-template-columns:1fr 1fr}
.frow.open .fbody{display:grid}
.fbody label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:#666;min-width:0}
.fbody input{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;border:1.5px solid #bbb;border-radius:14px;height:46px;padding:0 10px;font:inherit;font-size:16px;color:#222;background:#fff;min-width:0;max-width:100%;width:100%;text-align:left}
.ffoot{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px 22px calc(26px + var(--sab))}
.fb{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;height:52px;border-radius:30px;font-size:17px;font-weight:600}
.fb.out{border:2px solid var(--green-d);color:var(--green-d)}
.fb.use{background:var(--green-d);color:#fff}.fb.use:disabled{background:#e6e6e6;color:#888}
.trow.clk{cursor:pointer}.trow.clk:active{background:#f4f4f4}
.screen:has(.dbody){background:#f7f7f7}
.dh{background:#f7f7f7}
.dbody{padding:12px 22px calc(40px + var(--sab));display:flex;flex-direction:column;gap:22px}
.dcard{background:#fff;border-radius:26px;box-shadow:0 2px 16px #0000000f}
.dtop{padding:30px 16px 26px;display:flex;flex-direction:column;align-items:center}
.dchip{background:#f2f2f2;border-radius:8px;padding:9px 16px;font-size:15px;color:#555;margin:14px 0 30px}
.damt{font-size:34px;font-weight:700;color:#222}.damt small{font-size:18px;font-weight:500}
.dtyp{font-size:17px;color:#666;margin:14px 0 30px}
.dacts{display:grid;grid-template-columns:repeat(3,1fr);width:100%;text-align:center;font-size:15px;gap:6px}
.mi.big{width:54px;height:54px;border-radius:50%;margin:0 auto 12px}
.dinfo{padding:6px 26px 14px}
.dhead{display:flex;align-items:center;gap:18px;width:100%;padding:24px 0 16px;text-align:left}
.dhead b{flex:1;font-size:23px;font-weight:700}.dhead i{color:#333;transition:.2s}.dinfo:not(.open) .dhead i{transform:rotate(180deg)}
.dlist{display:none}.dinfo.open .dlist{display:block}
.drow{padding:14px 0 26px}.dl{font-size:15px;color:#666}.dv{font-size:17px;color:#222;margin-top:6px;word-break:break-word}

/* ---------- OSTATNE ---------- */
.stub{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 36px;color:#555;font-size:17px;line-height:1.5;min-height:70%}
.toast{position:absolute;left:50%;bottom:calc(30px + var(--sab));transform:translate(-50%,20px);background:#222;color:#fff;padding:13px 20px;border-radius:30px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ov{position:absolute;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mod{background:#fff;width:100%;border-radius:30px 30px 0 0;padding:26px 24px calc(30px + var(--sab));animation:inb .25s ease-out}
@keyframes inb{from{transform:translateY(40px)}to{transform:none}}
.mod h3{margin:0 0 18px;font-size:22px}
.mod .opt{display:block;width:100%;text-align:left;padding:16px 0;font-size:18px;border-bottom:1px solid var(--line)}
.pin{display:flex;gap:14px;justify-content:center;margin:26px 0 20px}
.pin b{width:56px;height:68px;border-radius:14px;background:var(--mint);display:grid;place-items:center;font-size:30px;color:var(--green)}
.mod .btn2{width:100%;justify-content:center;margin-top:16px}
</style>
</head>
<body>
<div id="app"><div class="toast" id="toast"></div></div>
<script>
"use strict";
/* ================= ikony ================= */
const I={
menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',
bell:'<path d="M6 16v-5a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21a2 2 0 004 0"/>',
user:'<circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7z"/>',
down:'<path d="M6 9l6 6 6-6"/>',up:'<path d="M6 15l6-6 6 6"/>',right:'<path d="M9 5l7 7-7 7"/>',
back:'<path d="M20 12H4M10 6l-6 6 6 6"/>',
eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',

share:'<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6"/>',

card:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19M6 15h3"/>',
star:'<circle cx="12" cy="12" r="9"/><path d="M12 7l1.5 3.2 3.5.4-2.6 2.4.7 3.5-3.1-1.8-3.1 1.8.7-3.5L7 10.6l3.5-.4z"/>',
close:'<path d="M5 5l14 14M19 5L5 19"/>',
doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 115 0c0 1.5-2.5 2-2.5 4"/><circle cx="12" cy="17" r=".7" fill="currentColor"/>',
home:'<path d="M4 11l8-7 8 7v9a1 1 0 01-1 1H5a1 1 0 01-1-1z"/>',

pig:'<path d="M10 3h4M12 3v3"/><path d="M12 6c-4 0-7 3-7 7s2 8 7 8 7-4 7-8-3-7-7-7z"/>',
loan:'<circle cx="12" cy="7" r="4"/><path d="M3 17h5l4 2 8-3-1.2-2.2-6 1.2"/>',
chart:'<rect x="3" y="11" width="4" height="9" rx="2"/><rect x="10" y="4" width="4" height="16" rx="2"/><rect x="17" y="8" width="4" height="12" rx="2"/>',
power:'<path d="M12 3v8"/><path d="M6.5 6.5a8 8 0 1011 0"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
exp:'<path d="M6 3h8l4 4v5M6 3v18h6"/><path d="M17 15v6M14 18l3 3 3-3"/>',
filter:'<path d="M5 3v18M12 3v18M19 3v18"/><path d="M3 8h4M10 15h4M17 7h4"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".7" fill="currentColor"/>',

dollarr:'<path d="M20 12a8 8 0 10-3 6.2"/><text x="12" y="15.5" text-anchor="middle" font-size="10" fill="currentColor" stroke="none" font-family="sans-serif">$</text><path d="M17 15l3 3-3 3"/>',
pinfield:'<rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 12h.01M10 12h.01M14 12h.01M18 12h.01" stroke-width="2.4"/>'
};
const ic=(n,s=24,w=1.6)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

/* ================= pomocné ================= */
const NB=" ";
const fmt=(n,sign)=>{const a=Math.abs(n).toFixed(2).split(".");
  const i=a[0].replace(/\B(?=(\d{3})+(?!\d))/g,NB);
  return (sign?(n<0?"−":"+"):(n<0?"−":""))+i+","+a[1]+NB+"EUR"};
const p2=n=>String(n).padStart(2,"0");
const dstr=d=>`${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()}`;
const D=(y,m,d)=>new Date(y,m-1,d);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

(function generuj(){            // náhodné doplnenie späť až do mája 2026
  const r=rng(8632), rr=(a,b)=>a+r()*(b-a), cents=v=>Math.round(v*100)/100;
  const lego=[24.99,49.99,79.99,124.99,214.99,359.99,446.99];
  const M=[
   {n:"LEGO System A/S Billund",w:3,f:()=>lego[Math.floor(r()*lego.length)]},
   {n:"N2G EXPORT NIORT",w:6,f:()=>cents(rr(20,70))},
   {n:"tenso Hong Kong Limite Admiralty",w:6,f:()=>cents(rr(15,190))},
   {n:"TIRO CO.LTD. SHIBUYA-KU",w:4,f:()=>cents(rr(15,40))},
   {n:"PAYPAL *YOYAKUNOW 4029357733",w:1,f:()=>cents(rr(15,40))},
   {n:"PAYPAL *DEAGOSTINI DEA 4029357733",w:1,f:()=>cents(rr(30,50))},
   {n:"POSTA LUZIANKY LUZIANKY",w:1,f:()=>cents(rr(5,40))},
   {n:"comicscentrum Praha - Stra",w:1,f:()=>Math.round(rr(20,90))},
   {n:"najada.cz Praha - Vino",w:1,f:()=>cents(rr(40,120))},
   {n:"GOPAY  *OBCHOD.CREW.CZ PRAHA 3",w:1,f:()=>cents(rr(30,80))},
  ];
  const sum=M.reduce((s,m)=>s+m.w,0);
  const pick=()=>{let x=r()*sum;for(const m of M){if((x-=m.w)<0)return m}return M[0]};
  const add=(d,t,desc,a)=>cardTx.push(Object.assign(T(d,t,desc,a),{gen:true}));
  const segment=(od,po)=>{
  for(let d=od;d<=po;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){
    const mo=d.getMonth()+1,dy=d.getDate();
    if(mo===9&&dy<=11)continue;                        // tieto dni už sú v dátach vyššie
    const x=r(), n=x<.5?0:x<.8?1:x<.93?2:3;
    let m=pick();
    for(let i=0;i<n;i++){ if(i&&r()>.5)m=pick(); add(d,PK,"*8632 "+m.n,-m.f()); }
    if(dy===2&&mo!==5){add(d,POP,"*8632 Mesačný popl. za vedenie kart. účtu",-10);add(d,POP,"Odmena za platby - vrátenie poplatku",10)}
    if(dy===21&&(d.getFullYear()===2025||mo<=9))add(d,"Splátka","*8632 Uhradená splátka",[57,76,100,150][Math.floor(r()*4)]);
    if(dy===30&&(d.getFullYear()===2025||mo<=9)){add(d,PK,"*8632 PAYPAL *ETORO EU 35314369001",-100);add(d,POP,"*8632 Popl. za dobíjanie digitálnych účtov cez platby kartou",-1)}
  }};
  segment(D(2026,5,1),D(2026,10,4));      // máj až október
  segment(D(2026,1,1),D(2026,4,30));      // január až apríl
  segment(D(2025,11,1),D(2025,12,31));    // november a december 2025
  cardTx.forEach(t=>{if(t.desc.includes("N2G EXPORT")&&!t.code)t.amt=Math.round(t.amt/5*100)/100});   // N2G: suma / 5
  cardTx.sort((a,b)=>(b.pending-a.pending)||(b.date-a.date));   // stabilné zoradenie
  // rovnaká suma sa nesmie opakovať blízko seba: vygenerované platby kartou sa posunú o pár centov
  const r2=rng(777),W=6,ci=v=>Math.round(v*100);
  cardTx.forEach((t,i)=>{
    if(!t.gen||t.type!==PK)return;
    for(let k=0;k<80;k++){
      let clash=false;
      for(let j=Math.max(0,i-W);j<=Math.min(cardTx.length-1,i+W);j++)if(j!==i&&ci(cardTx[j].amt)===ci(t.amt)){clash=true;break}
      if(!clash)break;
      const dl=(1+Math.floor(r2()*37))/100*(r2()<.5?-1:1);
      t.amt=(t.amt<0?-1:1)*Math.max(.5,Math.round((Math.abs(t.amt)+dl)*100)/100);
    }
  });
})();

  car.scrollLeft=state.cardIdx*car.scrollWidth/CARDS.length*0; // zarovnanie rieši snap
  requestAnimationFrame(()=>{const k=car.children;if(k.length>1)car.scrollLeft=state.cardIdx*(k[1].offsetLeft-k[0].offsetLeft)});
  let t;car.addEventListener("scroll",()=>{clearTimeout(t);t=setTimeout(()=>{
    const c=car.getBoundingClientRect();let best=0,bd=1e9;
    [...car.children].forEach((k,j)=>{const r=k.getBoundingClientRect();const d=Math.abs(r.left+r.width/2-(c.left+c.width/2));if(d<bd){bd=d;best=j}});
    if(best!==state.cardIdx)set(best)},60)});
}

const fdate=v=>{const [y,m,d]=v.split("-");return d+"."+m+"."+y};
const fnum=v=>{const n=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isNaN(n)?null:n};
function initTx(el,p){
  const data=p.src==="acc"?accTx:cardTx, key=p.src;
  let shown=state.shown[key]||PAGE, q="";
  const list=el.querySelector("#list"),inp=el.querySelector("#q");
  // pevný zelený pás pre stavový riadok iPhonu (biely text)
  el.insertAdjacentHTML("afterbegin",`<div class="sat"></div>`);
  el.querySelector(".thead").style.top="var(--sat)";
  const draw=()=>{
    const F=state.filters[key]||{};
    const from=F.from?new Date(F.from+"T00:00:00"):null, to=F.to?new Date(F.to+"T00:00:00"):null;
    const mn=fnum(F.min||""), mx=fnum(F.max||"");
    let f=data;
    if(from||to||mn!==null||mx!==null)f=f.filter(t=>{const a=Math.abs(t.amt);
      return (!from||t.date>=from)&&(!to||t.date<=to)&&(mn===null||a>=mn)&&(mx===null||a<=mx)});
    if(q)f=f.filter(t=>(t.type+" "+t.desc+" "+dstr(t.date)+" "+fmt(t.amt)+" "+(t.code||"")).toLowerCase().includes(q));
    if(!f.length){list.innerHTML=`<div class="empty">Nenašli sa žiadne transakcie</div>`;return}
    list.innerHTML=f.slice(0,shown).map(t=>{const click=true;   // detail je zapnutý pre všetky transakcie
     return `<div class="trow${click?" clk":""}"${click?` data-act="detail" data-src="${key}" data-i="${data.indexOf(t)}"`:""}>
     <div class="l">${t.pending?`<div class="pend">${ic("clock",24,1.6)}Čakajúca</div>`:""}
      <div class="k">${t.type}</div><div class="dsc">${esc(t.desc)}</div></div>
     <div class="rt"><div class="dt">${dstr(t.date)}</div><div class="am ${t.amt>0?"pos":""}">${fmt(t.amt,1)}</div></div></div>`}).join("")
     +(f.length>shown?`<button class="more" data-act="more-tx">Načítať viac</button>`:`<div style="height:calc(50px + var(--sab))"></div>`);
  };
  list._draw=draw;list._more=()=>{shown+=PAGE;state.shown[key]=shown;draw()};
  list._filter=()=>openFilter(key,()=>{shown=state.shown[key]||PAGE;draw();el.scrollTop=0});
  inp.addEventListener("input",()=>{q=inp.value.trim().toLowerCase();shown=q?9999:(state.shown[key]||PAGE);draw()});
  draw();
}

/* ---- filter ---- */
function openFilter(key,done){
  const saved=state.filters[key]||{};
  const cur={from:saved.from||"",to:saved.to||"",min:saved.min||"",max:saved.max||""};
  const o=document.createElement("div");o.className="ov fov";
  const val=()=>({
    kedy:(cur.from||cur.to)?((cur.from?fdate(cur.from):"…")+" – "+(cur.to?fdate(cur.to):"…")):"Všetko",
    suma:(cur.min||cur.max)?((cur.min?"od "+cur.min:"")+(cur.min&&cur.max?" ":"")+(cur.max?"do "+cur.max:"")+" EUR"):"–"});
  const row=(id,icn,title,hasBody)=>`<div class="frow" data-r="${id}"><button class="fhead" ${hasBody?`data-t="${id}"`:""}>${ic(icn,30,1.4)}<span><b>${title}</b><em data-v="${id}"></em></span><i class="chev">${ic("down",28,1.5)}</i></button>
    ${id==="kedy"?`<div class="fbody"><label>Od<input type="date" data-f="from" value="${cur.from}"></label><label>Do<input type="date" data-f="to" value="${cur.to}"></label></div>`:""}
    ${id==="suma"?`<div class="fbody"><label>Od (EUR)<input type="text" inputmode="decimal" placeholder="0,00" data-f="min" value="${cur.min}"></label><label>Do (EUR)<input type="text" inputmode="decimal" placeholder="0,00" data-f="max" value="${cur.max}"></label></div>`:""}</div>`;
  o.innerHTML=`<div class="fsheet"><button class="fx" data-fclose>${ic("close",40,1.2)}</button><h3>Filtre</h3><div class="fscroll">
    ${row("zobr","dollarr","Zobraziť transakcie",false)}${row("kedy","cal","Kedy",true)}${row("suma","coins","Suma",true)}${row("typ","transfer","Typ",false)}</div>
    <div class="ffoot"><button class="fb out" data-freset>Resetovať</button><button class="fb use" data-fuse disabled>Použiť</button></div></div>`;
  const refresh=()=>{
    const v=val();o.querySelector('[data-v=kedy]').textContent=v.kedy;o.querySelector('[data-v=suma]').textContent=v.suma;
    o.querySelector('[data-v=zobr]').textContent="–";o.querySelector('[data-v=typ]').textContent="–";
    const changed=["from","to","min","max"].some(k=>cur[k]!==(saved[k]||""));
    o.querySelector("[data-fuse]").disabled=!changed;
  };
  o.addEventListener("click",e=>{
    if(e.target===o||e.target.closest("[data-fclose]")){o.remove();return}
    const h=e.target.closest(".fhead[data-t]");if(h)h.parentElement.classList.toggle("open");
    if(e.target.closest("[data-freset]")){["from","to","min","max"].forEach(k=>cur[k]="");o.querySelectorAll("[data-f]").forEach(i=>i.value="");refresh();state.filters[key]={};o.querySelector("[data-fuse]").disabled=false}
    if(e.target.closest("[data-fuse]")&&!e.target.closest("[data-fuse]").disabled){state.filters[key]={...cur};o.remove();done()}
  });
  o.addEventListener("input",e=>{const k=e.target.dataset.f;if(k){cur[k]=e.target.value.trim();refresh()}});
  app.appendChild(o);refresh();
}

/* ---- detail transakcie ---- */
const addBd=(d,n)=>{const x=new Date(d);while(n>0){x.setDate(x.getDate()+1);const w=x.getDay();if(w!==0&&w!==6)n--}return x};
V.detail=p=>{
  const t=(p.src==="acc"?accTx:cardTx)[p.i];
  const eur=fmt(Math.abs(t.amt)).replace(NB+"EUR","");
  const book=addBd(t.date,2);
  const [mena,kurz]=p.src==="acc"?["EUR",1]:/tenso Hong Kong/.test(t.desc)?["HKD",8.45]:/TIRO CO/.test(t.desc)?["JPY",168]:/YOYAKUNOW SINGAPORE/.test(t.desc)?["SGD",1.49]:/comicscentrum|najada|GOPAY/.test(t.desc)?["CZK",24.35]:["EUR",1];
  const orig=mena==="EUR"?eur:fmt(Math.abs(t.amt)*kurz*(1+((p.i*37)%11-5)/1000)).replace(NB+"EUR","");
  const row=(l,v)=>`<div class="drow"><div class="dl">${l}</div><div class="dv">${v}</div></div>`;
  return `<div class="sat"></div><div class="thead dh" style="top:var(--sat)"><div class="ttl" style="margin-bottom:0"><button class="ibtn" data-act="back" style="margin-left:-6px">${ic("back",34,1.3)}</button><h1>Detail transakcie</h1></div></div>
  <div class="dbody">
   <div class="dcard dtop">
    <svg width="140" height="130" viewBox="0 0 140 130"><path d="M22 70c-6-26 18-52 52-56 36-4 58 20 52 50-6 32-40 50-68 40-20-7-32-16-36-34z" fill="#dff3e8"/><g fill="none" stroke="#222" stroke-width="2"><ellipse cx="52" cy="46" rx="26" ry="8"/><path d="M26 46v36c0 5 12 9 26 9M26 62c0 5 12 9 26 9M78 46v10"/></g><circle cx="86" cy="66" r="24" fill="#3c8a5b" stroke="#fff" stroke-width="4"/><circle cx="86" cy="66" r="28" fill="none" stroke="#222" stroke-width="2"/><text x="86" y="75" text-anchor="middle" font-size="26" fill="#222" font-family="sans-serif">$</text></svg>
    <div class="dchip">${dstr(book)}</div>
    <div class="damt">${eur} <small>EUR</small></div>
    <div class="dtyp">${t.type}</div>
    <div class="dacts"><div><div class="mi big">${ic("doc",28,1.5)}</div>Potvrdenie</div><div><div class="mi big">${ic("share",28,1.5)}</div>Zdieľať</div><div><div class="mi big">${ic("nodes",28,1.5)}</div>Zdieľať platbu</div></div>
   </div>
   <div class="dcard dinfo open" id="dinfo"><button class="dhead" data-act="dtoggle">${ic("folder",34,1.4)}<b>Základné údaje</b><i>${ic("up",30,1.5)}</i></button>
    <div class="dlist">
     ${row("Dátum a čas autorizácie",dstr(t.date)+" 00:00:00")}
     ${row("Dátum zaúčtovania",dstr(book))}
     ${row("Popis transakcie",esc(t.desc))}
     ${p.src==="acc"?"":row("Číslo karty","*8632")}
     ${row("Suma v mene karty/účtu",eur)}
     ${row("Mena","EUR")}
     ${row("Suma v pôvodnej mene",orig)}
     ${row("Pôvodná mena",mena)}
     ${row("Typ transakcie",t.type)}
     ${row("Stav transakcie",t.pending?"Čakajúca":"Zrealizované")}
     ${row("Výsledok autorizácie","Schválená")}
     ${row("Suma a mena Cashback","–")}
    </div></div>
  </div>`;
};

V.stub=p=>`<div class="sat"></div><div class="thead g" style="top:var(--sat)"><div class="ttl" style="margin-bottom:0"><button class="ibtn" data-act="back" style="margin-left:-6px">${ic("back",34,1.3)}</button><h1>${p.t||""}</h1></div></div>
 <div class="stub"><div style="color:var(--green);margin-bottom:16px">${ic("info",56,1.2)}</div>Táto obrazovka nie je súčasťou dema.<br>Skúste Domov, Karty alebo Transakcie.</div>`;

/* ================= udalosti ================= */
app.addEventListener("click",e=>{
  const a=e.target.closest("[data-go],[data-act]");if(!a)return;
  if(a.dataset.go){
    const g=a.dataset.go;
    if(g==="home"){goHome();return}
    if(g==="stub")return;                       // neimplementované obrazovky: nič sa nestane
    go(g,{t:a.dataset.t,src:a.dataset.src});return}
  switch(a.dataset.act){
    case"demo":demo();break;
    case"back":back();break;
    case"close":back();break;
    case"home":goHome();break;
    case"eye":state.hidden=!state.hidden;render();break;
    case"copy":navigator.clipboard?.writeText("SK50 0200 0000 0005 5410 1168").catch(()=>{});toast("IBAN skopírovaný");break;
    case"acc":{const t=a.dataset.t;state.menuOpen[t]=!state.menuOpen[t];
      a.closest(".mitem").classList.toggle("open",state.menuOpen[t]);
      a.lastElementChild.outerHTML=ic(state.menuOpen[t]?"up":"down",24,1.6);break}
    case"logout":break;
    case"more-tx":a.closest("#list")._more();break;
    case"filter":app.querySelector("#list")._filter();break;
    case"detail":go("detail",{src:a.dataset.src,i:+a.dataset.i});break;
    case"dtoggle":a.closest(".dcard").classList.toggle("open");break;
    case"pin":modal(`<h3>PIN karty ${CARDS[state.cardIdx].name.slice(0,5)}</h3><div class="pin"><b>4</b><b>8</b><b>2</b><b>1</b></div><div style="color:#666;font-size:14px;text-align:center">Demo PIN. Zobrazuje sa len ukážkovo.</div><button class="btn2" data-act="mclose">Zavrieť</button>`);break;
    case"more":modal(`<h3>Ďalšie akcie</h3><button class="opt" data-act="demo">Zmeniť limity</button><button class="opt" data-act="demo">Zablokovať kartu</button><button class="opt" data-act="demo">Nastavenia platieb</button><button class="btn2" data-act="mclose">Zavrieť</button>`);break;
    case"mclose":closeModal();break;
  }
});
// zákaz pinch-zoomu a double-tap zoomu na iOS
["gesturestart","gesturechange"].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
function fit(){
  const st=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
  const pr=document.createElement('div');pr.style.cssText='position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top,0px)';document.body.appendChild(pr);
  const sat=parseFloat(getComputedStyle(pr).paddingTop)||0;pr.remove();
  const gap=st&&sat>0&&innerWidth<600&&innerHeight>innerWidth?Math.max(0,screen.height-innerHeight):0;
  document.documentElement.style.setProperty("--gap",gap+"px");
}
fit();addEventListener("resize",fit);addEventListener("orientationchange",fit);
render();
</script>
</body>
</html>
